name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: ${{ matrix.module }} (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [backend, ai-microservice]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      # Tests use an in-memory H2 database and a mocked AI client, so no services are needed.
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-test-reports
          path: ${{ matrix.module }}/target/surefire-reports/
          retention-days: 7

  frontend-admin:
    name: frontend-admin (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  widget:
    name: widget (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check widget/chat-widget.js

  e2e:
    name: e2e (browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            ai-microservice/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend-admin/package-lock.json
            e2e/package-lock.json
      - name: Start Postgres
        run: docker compose up -d --wait
      - name: Build services
        run: |
          (cd ai-microservice && mvn -B -ntp -DskipTests package)
          (cd backend && mvn -B -ntp -DskipTests package)
      - name: Build admin panel
        working-directory: frontend-admin
        run: npm ci && npm run build
      - name: Install e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Playwright starts both services, the admin panel (vite preview) and the widget page itself.
      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  production-stack:
    name: production stack (Docker + HTTPS smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # *.localhost hosts make Caddy use its internal CA instead of Let's Encrypt.
      - name: Write a throwaway production env file
        run: |
          cat > .env.production <<EOF
          ADMIN_HOST=admin.localhost
          API_HOST=api.localhost
          DB_USER=chatbot
          DB_PASSWORD=$(openssl rand -hex 32)
          AI_API_KEY=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          EOF
      # Two instances of the backend and AI service, to keep the scaled-out setup (shared Redis rate limits,
      # AI model versioning, Caddy load balancing) tested.
      - name: Build and start the production stack (2 backends, 2 AI services)
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --wait --scale backend=2 --scale ai=2
      - name: Smoke test over HTTPS
        run: deploy/smoke-test.sh .env.production
      # Encrypted off-site copy and restore, against a throwaway S3 server (deploy/test/offsite-s3.override.yml).
      - name: Off-site backup round trip
        run: deploy/test/offsite-roundtrip.sh .env.production
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f deploy/test/offsite-s3.override.yml --env-file .env.production --profile offsite logs --no-color --tail 200
