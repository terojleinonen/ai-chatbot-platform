# Local PostgreSQL for both services. Credentials match the defaults in application.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main_backend
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    # Healthy once the second database exists, i.e. after the init script ran (`docker compose up -d --wait`).
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "user", "-d", "ai_microservice"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
