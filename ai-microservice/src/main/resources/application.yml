# Production configuration: every credential must come from the environment (no defaults).
# For local development run with SPRING_PROFILES_ACTIVE=dev (see application-dev.yml).
server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Schema changes are Flyway migrations (src/main/resources/db/migration); Hibernate only validates.
  flyway:
    # Databases created before Flyway (by Hibernate) are adopted as version 1 without re-running V1.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Health and Prometheus metrics on a separate management port that is never published: only the private
# network (and Caddy, for /actuator/health) can reach it.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ai-microservice

logging:
  # "json" for structured (JSON) logs, "plain" for the default console format.
  format: ${LOG_FORMAT:plain}

security:
  # Only the dev profile may use the built-in dev API key.
  dev-mode: false
  # Shared secret the main backend sends in the X-API-KEY header. At least 32 characters.
  api-key: ${AI_API_KEY}

# Answers are generated by Claude from each tenant's FAQs. Without ANTHROPIC_API_KEY the service falls back to
# keyword matching (the FAQ whose question is most similar to the customer's).
ai:
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    # Optional: another endpoint for the Anthropic API (e.g. a company gateway).
    base-url: ${ANTHROPIC_BASE_URL:}
    model: ${AI_LLM_MODEL:claude-opus-5}
    # low | medium | high | xhigh | max (empty = the model's default). Short FAQ answers do well at low.
    effort: ${AI_LLM_EFFORT:low}
    max-tokens: ${AI_LLM_MAX_TOKENS:2048}
    # FAQs up to this many characters are all sent (and prompt-cached); larger sets send the most relevant ones.
    max-context-chars: ${AI_LLM_MAX_CONTEXT_CHARS:24000}
    # Per attempt; a failed attempt is retried max-retries times before falling back to keyword matching.
    timeout: ${AI_LLM_TIMEOUT:20s}
    max-retries: ${AI_LLM_MAX_RETRIES:1}
