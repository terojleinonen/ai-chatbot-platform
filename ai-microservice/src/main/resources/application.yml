# Production configuration: every credential must come from the environment (no defaults).
# For local development run with SPRING_PROFILES_ACTIVE=dev (see application-dev.yml).
server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Schema changes are Flyway migrations (src/main/resources/db/migration); Hibernate only validates.
  flyway:
    # Databases created before Flyway (by Hibernate) are adopted as version 1 without re-running V1.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  # Only the dev profile may use the built-in dev API key.
  dev-mode: false
  # Shared secret the main backend sends in the X-API-KEY header. At least 32 characters.
  api-key: ${AI_API_KEY}
