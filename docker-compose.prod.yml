# Production stack. Only the "web" service (Caddy) is reachable from outside, on ports 80/443;
# Postgres, Redis, the AI service and the backend live on a private network.
# The backend and AI service can run several instances: --scale backend=2 --scale ai=2 (see README).
#
#   cp deploy/production.env.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See README "Deploying to production".
name: ai-chatbot

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: main_backend
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d ai_microservice"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [internal]

  # Shared login/chat rate-limit counters, so several backend instances enforce one limit. Counters only
  # (short-lived), so no persistence.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  ai:
    build: ./ai-microservice
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_microservice
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/main_backend
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_BASE_URL: http://ai:8081
      AI_API_KEY: ${AI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${ADMIN_HOST:?set ADMIN_HOST}
      # Trust X-Forwarded-* from Caddy (private network) so rate limits see real client IPs.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOG_FORMAT: json
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        API_HOST: ${API_HOST:?set API_HOST}
    restart: unless-stopped
    environment:
      ADMIN_HOST: ${ADMIN_HOST}
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data     # certificates: keep this volume, or Let's Encrypt rate limits may bite
      - caddy_config:/config
    depends_on: [backend]
    networks: [internal]

  # Dumps both databases at startup and then every BACKUP_INTERVAL_HOURS into ./backups/<timestamp>/ on the host,
  # keeping BACKUP_KEEP_DAYS days. Copy ./backups off the server too. Restore with deploy/restore.sh.
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Optional metrics: docker compose ... --profile monitoring up -d
  # Scrapes both services' private management ports. The UI is published on the server's localhost only;
  # reach it with an SSH tunnel: ssh -L 9090:localhost:9090 <server>, then open http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
