<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Widget Demo</title>
  </head>
  <body>
    <h1>Chat widget demo</h1>
    <p>Serve this folder (e.g. <code>npx serve widget</code>) and click the bubble in the corner.</p>

    <script src="chat-widget.js"></script>
    <script>
      // Optional ?tenantId=... (and ?backendUrl=...) to try other tenants without editing this file.
      const params = new URLSearchParams(location.search);
      ChatWidget.init({
        backendUrl: params.get("backendUrl") || "http://localhost:8080",
        tenantId: Number(params.get("tenantId") || 1),
        title: "Support"
      });
    </script>
  </body>
</html>
