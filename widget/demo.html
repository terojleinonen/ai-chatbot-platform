<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Widget Demo</title>
  </head>
  <body>
    <h1>Chat widget demo</h1>
    <p>Serve this folder (e.g. <code>npx serve widget</code>) and click the bubble in the corner.</p>

    <script src="chat-widget.js"></script>
    <script>
      // Pass ?widgetKey=... (copy it from the Tenants page in the admin panel) and optionally ?backendUrl=...
      const params = new URLSearchParams(location.search);
      ChatWidget.init({
        backendUrl: params.get("backendUrl") || "http://localhost:8080",
        widgetKey: params.get("widgetKey"),
        title: "Support"
      });
    </script>
  </body>
</html>
