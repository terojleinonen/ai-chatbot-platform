spring:
  # Redis is only connected when RATE_LIMIT_STORE=redis (see RateLimitConfig), not auto-configured.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  datasource:
    url: jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # Tests use in-memory H2; the Flyway migrations (PostgreSQL SQL) are exercised by the e2e tests.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

ai:
  base-url: http://localhost:0
  api-key: test-ai-key-that-is-at-least-32-characters

security:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long
    ttl: 1h
  admin:
    username: admin
    password: test-password
  login-rate-limit:
    max-failures-per-user-and-ip: 5
    max-failures-per-ip: 20
    window: 15m
  cors:
    allowed-origins: http://localhost:5173

# Rate limit counters (login and chat): "memory" for a single backend instance, "redis" to share them between
# several instances (then REDIS_URL, e.g. redis://redis:6379, is required).
rate-limit:
  store: ${RATE_LIMIT_STORE:memory}
  redis-url: ${REDIS_URL:}

chat:
  max-message-length: 1000
  rate-limit:
    max-messages-per-ip: 20
    window: 1m

# Note: this file replaces src/main/resources/application.yml in tests, so it repeats what tests rely on.
management:
  server:
    port: 0   # random free port in tests
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: backend
