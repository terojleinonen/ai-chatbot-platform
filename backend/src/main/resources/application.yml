# Production configuration: every credential must come from the environment (no defaults).
# For local development run with SPRING_PROFILES_ACTIVE=dev, which supplies safe-for-dev defaults
# (see application-dev.yml).
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Schema changes are Flyway migrations (src/main/resources/db/migration); Hibernate only validates.
  flyway:
    # Databases created before Flyway (by Hibernate) are adopted as version 1 without re-running V1.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ai:
  base-url: ${AI_BASE_URL:http://localhost:8081}
  # Must match security.api-key in the ai-microservice. At least 32 characters.
  api-key: ${AI_API_KEY}

chat:
  # Public chat (widget) protection, applied before the AI service is called.
  max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:1000}
  rate-limit:
    max-messages-per-ip: ${CHAT_MAX_MESSAGES_PER_IP:20}
    window: ${CHAT_RATE_LIMIT_WINDOW:1m}

security:
  # Only the dev profile may use the built-in dev secrets or a random JWT key.
  dev-mode: false
  jwt:
    # HS256 signing key, at least 32 characters.
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:8h}
  admin:
    # First admin account, created only when no admin users exist yet.
    username: ${ADMIN_USERNAME:admin}
    # If unset, a random password is generated and printed to the log once.
    password: ${ADMIN_PASSWORD:}
  login-rate-limit:
    # Failed logins allowed per client IP + username, and per client IP across all usernames, within the window.
    max-failures-per-user-and-ip: ${LOGIN_MAX_FAILURES_PER_USER_AND_IP:5}
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
    window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
  cors:
    # Admin panel origin(s), comma-separated, e.g. https://admin.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
